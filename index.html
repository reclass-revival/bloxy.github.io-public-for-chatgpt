
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOXY — Log In</title>
  <style>
    :root {
      --red: #e43b48;
      --ink: #202333;
      --muted: #777d8d;
      --line: #e7e8ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, #f5f7fb, #e9edf5);
      font-family: Arial, sans-serif;
      color: var(--ink);
    }

    .wrap { width: 100%; max-width: 430px; }

    header { text-align: center; margin-bottom: 25px; }

    .logo {
      color: var(--red);
      font-size: 43px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .tagline {
      color: var(--muted);
      font-size: 14px;
      margin-top: 5px;
    }

    .card {
      background: white;
      padding: 34px;
      border-radius: 12px;
      box-shadow: 0 12px 40px #20233314;
    }

    h1 { font-size: 25px; margin: 0 0 8px; }

    .intro {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 25px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 17px 0 8px;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus { border-color: var(--red); }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 11px;
      color: var(--red);
      font-size: 13px;
      text-decoration: none;
    }

    button {
      width: 100%;
      height: 47px;
      border: 0;
      border-radius: 7px;
      background: var(--red);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 22px;
    }

    button:hover { background: #cc303e; }

    .separator {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #999;
      font-size: 11px;
      font-weight: bold;
      margin: 25px 0 0;
    }

    .separator::before, .separator::after {
      content: "";
      height: 1px;
      background: var(--line);
      flex: 1;
    }

    .signup {
      display: block;
      text-align: center;
      margin-top: 17px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .signup:hover { border-color: var(--red); color: var(--red); }

    footer {
      text-align: center;
      color: #9297a4;
      font-size: 11px;
      margin-top: 23px;
    }

    @media (max-width: 430px) {
      .card { padding: 26px 21px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo">BLOXY</div>
      <div class="tagline">Your world. Your games. Your BLOXY.</div>
    </header>

    <section class="card">
      <h1>Welcome back</h1>
      <p class="intro">Log in to continue to your BLOXY account.</p>

      <form id="loginForm">
        <label for="username">Username or Email</label>
        <input id="username" type="text"
          placeholder="Enter your username or email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
          placeholder="Enter your password" required>

        <a class="forgot" href="#"
          id="forgot">Forgot password?</a>

        <button type="submit">Log In</button>
      </form>

      <div class="separator">NEW TO BLOXY?</div>
      <a class="signup" href="signup.html">Create an Account</a>
    </section>

    <footer>© 2026 BLOXY. All Rights Reserved.</footer>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("BLOXY login is not connected yet.");
    });

    document.getElementById("forgot").addEventListener("click", function(event) {
      event.preventDefault();
      alert("Password recovery is not available yet.");
    });
  </script>
</body>
</html>
