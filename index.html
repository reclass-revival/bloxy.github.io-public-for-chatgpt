
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOXY - Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e9f3fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-card {
      background: white;
      width: 360px;
      max-width: 92%;
      padding: 32px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 3px 15px #00000015;
    }

    .logo {
      color: #e52b35;
      font-size: 43px;
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #c9c9c9;
      border-radius: 5px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #e52b35;
      color: white;
    }

    .signup {
      background: #f1f1f1;
      color: #333;
    }

    a {
      color: #e52b35;
      text-decoration: none;
      font-size: 13px;
    }

    .footer {
      margin-top: 25px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">BLOXY</div>

    <form id="loginForm">
      <input type="text" placeholder="Username or Email" required>
      <input type="password" placeholder="Password" required>

      <button class="login" type="submit">Log In</button>
    </form>

    <p><a href="#">Forgot Password?</a></p>

    <button class="signup" onclick="location.href='signup.html'">
      Sign Up
    </button>

    <div class="footer">
      © 2026 BLOXY. All Rights Reserved.
    </div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("BLOXY login is not connected yet!");
    });
  </script>
</body>
</html>
